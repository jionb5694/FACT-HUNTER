<!doctype html>
<html lang="ko"><head>
    <script type="module" src="/@vite/client"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACT HUNTER — AI와 함께 진실을 찾아가는 정보 검증 서비스</title>
    <meta name="description" content="AI와 함께 진실을 찾아가는 정보 검증 서비스 — 뉴스, SNS, 이미지 속 주장을 근거와 출처로 비판적으로 분석합니다.">
    <meta property="og:title" content="FACT HUNTER — AI와 함께 진실을 찾아가는 정보 검증 서비스">
    <meta property="og:description" content="뉴스, SNS 게시글, 이미지의 신뢰도를 AI와 실시간 출처 검색으로 검증하고 비판적 사고를 돕는 서비스입니다.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Outfit:wght@600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
      :root {
        --bg-canvas: #090e1c;
        --bg-surface: #11182f;
        --bg-surface-sub: #0c1226;
        --bg-input: #0b1022;
        --bg-elevated: #141d38;
        --border-subtle: #232d4d;
        --border-card: #263257;
        --border-strong: #344272;
        --text-primary: #eef2ff;
        --text-secondary: #cbd5f5;
        --text-muted: #9aa6ca;
        --text-dim: #8d99be;
        --accent: #7c3aed;
        --accent-hover: #8b5cf6;
        --accent-soft: rgba(124, 58, 237, 0.16);
        --accent-text: #c4b5fd;
        --green: #34d399;
        --rose: #fb7185;
        --amber: #fbbf24;
        --sky: #38bdf8;
        --font-sans: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        --font-display: "Outfit", "Pretendard Variable", "Noto Sans KR", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html {
        font-family: var(--font-sans);
        scroll-behavior: smooth;
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        line-height: 1.65;
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4, p, ul, ol {
        margin: 0;
      }

      h1, h2, h3, h4 {
        text-wrap: balance;
      }

      button, input, textarea {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        background: none;
        border: none;
      }

      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid #a78bfa;
        outline-offset: 2px;
      }

      a {
        color: inherit;
      }

      .tabular {
        font-variant-numeric: tabular-nums;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Layout Containers */
      .container {
        width: 100%;
        max-width: 1152px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .container-narrow {
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        padding: 0 16px;
      }

      @media (min-width: 640px) {
        .container, .container-narrow {
          padding: 0 24px;
        }
      }

      /* Header */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 30;
        border-bottom: 1px solid var(--border-subtle);
        background: rgba(9, 14, 28, 0.95);
        backdrop-filter: blur(8px);
      }

      .header-inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 0;
      }

      .brand-btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        white-space: nowrap;
        flex-shrink: 0;
        border-radius: 8px;
      }

      .brand-title {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
        white-space: nowrap;
      }

      .main-nav {
        order: 3;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 0.8rem;
        font-weight: 500;
        overflow-x: auto;
        padding-top: 2px;
      }

      @media (min-width: 640px) {
        .header-inner { flex-wrap: nowrap; }
        .brand-title { font-size: 1.15rem; }
        .main-nav { order: 0; width: auto; gap: 22px; font-size: 0.875rem; padding-top: 0; }
      }

      .nav-link {
        padding: 6px 2px;
        border-bottom: 2px solid transparent;
        color: var(--text-muted);
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.15s ease, border-color 0.15s ease;
      }

      .nav-link:hover {
        color: #fff;
      }

      .nav-link.active {
        color: #fff;
        border-bottom-color: #a78bfa;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .header-download {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 8px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        color: #eef2ff;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      .header-download:hover {
        background: #1d294d;
        border-color: #a78bfa;
      }

      .header-cta {
        display: none;
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease;
      }

      .header-cta:hover {
        background: var(--accent-hover);
      }

      @media (min-width: 720px) {
        .header-cta { display: inline-flex; align-items: center; }
      }

      main {
        flex: 1;
      }

      .page-section {
        padding: 32px 0 48px;
      }

      @media (min-width: 640px) {
        .page-section { padding: 44px 0 60px; }
      }

      .stack-sm > * + * { margin-top: 12px; }
      .stack-md > * + * { margin-top: 20px; }
      .stack-lg > * + * { margin-top: 32px; }
      .stack-xl > * + * { margin-top: 44px; }

      /* Cards & Surfaces */
      .card {
        border: 1px solid var(--border-card);
        background: var(--bg-surface);
        border-radius: 16px;
        padding: 20px;
      }

      @media (min-width: 640px) {
        .card-lg { padding: 28px; }
      }

      .subcard {
        border: 1px solid var(--border-subtle);
        background: var(--bg-surface-sub);
        border-radius: 12px;
        padding: 16px;
      }

      .inset-box {
        border: 1px solid #1e2747;
        background: #090e1c;
        border-radius: 10px;
        padding: 12px 14px;
      }

      /* Typography */
      .hero-lockup {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .hero-title {
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 3.2vw, 2.35rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff;
        line-height: 1.15;
      }

      .hero-sub {
        font-size: 0.92rem;
        font-weight: 500;
        color: var(--accent-text);
        margin-top: 2px;
      }

      .hero-desc {
        margin-top: 18px;
        max-width: 72ch;
        font-size: 1rem;
        color: #b8c3e4;
      }

      .section-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: #fff;
      }

      .page-title {
        font-size: clamp(1.45rem, 2.5vw, 1.85rem);
        font-weight: 700;
        color: #fff;
        line-height: 1.3;
      }

      .muted { color: var(--text-muted); }
      .dim { color: var(--text-dim); }
      .text-xs { font-size: 0.75rem; }
      .text-sm { font-size: 0.875rem; }
      .text-base { font-size: 1rem; }

      /* Grids */
      .grid-home {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        align-items: start;
      }

      @media (min-width: 1024px) {
        .grid-home {
          grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr);
        }
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      @media (min-width: 768px) {
        .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      .grid-3 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      @media (min-width: 768px) {
        .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      .grid-kpi {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      @media (min-width: 640px) {
        .grid-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (min-width: 1024px) {
        .grid-kpi { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      }

      .grid-dashboard {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }

      @media (min-width: 1024px) {
        .grid-dashboard {
          grid-template-columns: 5fr 7fr;
        }
      }

      /* Form Controls & Buttons */
      .textarea-main {
        width: 100%;
        min-height: 170px;
        resize: vertical;
        border: 1px solid #28345c;
        border-radius: 12px;
        background: var(--bg-input);
        padding: 14px 16px;
        color: #f1f5ff;
        font-size: 0.95rem;
        line-height: 1.65;
      }

      .textarea-main::placeholder, .input-field::placeholder {
        color: #667399;
      }

      .textarea-main:focus, .input-field:focus {
        outline: none;
        border-color: var(--accent-hover);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25);
      }

      .input-field {
        width: 100%;
        border: 1px solid #28345c;
        border-radius: 10px;
        background: var(--bg-input);
        padding: 9px 12px;
        color: #fff;
        font-size: 0.85rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: 10px;
        padding: 9px 16px;
        font-size: 0.82rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .btn-sm {
        padding: 6px 12px;
        font-size: 0.75rem;
        border-radius: 8px;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-secondary {
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        color: #eef2ff;
      }

      .btn-secondary:hover {
        background: #1d294d;
        border-color: #6d7eb8;
      }

      .btn-ghost {
        background: #151e3b;
        border: 1px solid #32406e;
        color: #ddd6fe;
      }

      .btn-ghost:hover {
        background: #1e2952;
      }

      .btn-soft-violet {
        background: rgba(124, 58, 237, 0.2);
        border: 1px solid rgba(139, 92, 246, 0.45);
        color: #ddd6fe;
      }

      .btn-soft-violet:hover {
        background: rgba(124, 58, 237, 0.34);
      }

      .btn-danger {
        background: rgba(244, 63, 94, 0.12);
        border: 1px solid rgba(244, 63, 94, 0.35);
        color: #fecdd3;
      }

      .btn-danger:hover {
        background: rgba(244, 63, 94, 0.22);
      }

      /* Dropzone & Image Preview */
      .dropzone-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px dashed #2f3b66;
        border-radius: 12px;
        background: var(--bg-surface-sub);
        padding: 13px 16px;
      }

      .form-dragging {
        border-color: #a78bfa !important;
        background: #151e3b !important;
      }

      .image-preview-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border: 1px solid #2d3963;
        border-radius: 12px;
        background: var(--bg-surface-sub);
        padding: 12px 14px;
      }

      .thumb-img {
        width: 80px;
        height: 64px;
        border-radius: 8px;
        border: 1px solid #2b375f;
        object-fit: cover;
        background: #090e1c;
        flex-shrink: 0;
      }

      /* Alert & Status Notices */
      .alert-error {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        border-radius: 12px;
        border: 1px solid rgba(244, 63, 94, 0.45);
        background: rgba(76, 5, 25, 0.45);
        padding: 12px 16px;
        font-size: 0.86rem;
        color: #ffe4e6;
      }

      .notice-violet {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        border-radius: 12px;
        border: 1px solid rgba(139, 92, 246, 0.4);
        background: rgba(46, 16, 101, 0.32);
        padding: 13px 16px;
        font-size: 0.84rem;
        color: #ede9fe;
      }

      .notice-amber {
        border-radius: 10px;
        border: 1px solid rgba(245, 158, 11, 0.35);
        background: rgba(245, 158, 11, 0.1);
        padding: 10px 14px;
        font-size: 0.8rem;
        color: #fef3c7;
      }

      /* Semantic Badges (strictly for verification state, evidence level, relation) */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .badge-verified { border: 1px solid rgba(52, 211, 153, 0.42); background: rgba(16, 185, 129, 0.12); color: #6ee7b7; }
      .badge-refuted { border: 1px solid rgba(251, 113, 133, 0.42); background: rgba(244, 63, 94, 0.12); color: #fda4af; }
      .badge-pending { border: 1px solid rgba(251, 191, 36, 0.42); background: rgba(245, 158, 11, 0.12); color: #fde68a; }
      .badge-sufficient { border: 1px solid rgba(56, 189, 248, 0.42); background: rgba(14, 165, 233, 0.12); color: #bae6fd; }
      .badge-limited { border: 1px solid rgba(167, 139, 250, 0.42); background: rgba(139, 92, 246, 0.12); color: #ddd6fe; }
      .badge-insufficient { border: 1px solid #3b4a7d; background: #161f3e; color: #b8c3e4; }
      .badge-neutral { border: 1px solid #32406e; background: #151e3b; color: #ddd6fe; }

      /* Interactive Highlight Marks */
      .hl-btn {
        display: inline;
        padding: 2px 4px;
        border-radius: 4px;
        text-align: left;
        transition: background-color 0.15s ease;
      }

      .hl-claim { background: rgba(139, 92, 246, 0.26); border-bottom: 2px solid #a78bfa; color: #fff; }
      .hl-claim:hover { background: rgba(139, 92, 246, 0.42); }
      .hl-needs_verification { background: rgba(56, 189, 248, 0.24); border-bottom: 2px solid #38bdf8; color: #fff; }
      .hl-needs_verification:hover { background: rgba(56, 189, 248, 0.4); }
      .hl-exaggeration { background: rgba(245, 158, 11, 0.26); border-bottom: 2px solid #fbbf24; color: #fff; }
      .hl-exaggeration:hover { background: rgba(245, 158, 11, 0.42); }
      .hl-fallacy { background: rgba(244, 63, 94, 0.26); border-bottom: 2px solid #fb7185; color: #fff; }
      .hl-fallacy:hover { background: rgba(244, 63, 94, 0.42); }
      .hl-active { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85); }

      /* Tables */
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
      }

      table.data-table {
        width: 100%;
        min-width: 600px;
        border-collapse: collapse;
        text-align: left;
        font-size: 0.82rem;
      }

      table.data-table thead {
        background: var(--bg-input);
        color: #a5b1d6;
        border-bottom: 1px solid var(--border-subtle);
      }

      table.data-table th, table.data-table td {
        padding: 11px 14px;
        vertical-align: top;
      }

      table.data-table tbody tr {
        background: #0e152b;
        border-top: 1px solid #1e2747;
      }

      table.data-table tbody tr:hover {
        background: rgba(20, 29, 56, 0.75);
      }

      /* Segmented Filter Controls */
      .segmented {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        border-radius: 10px;
        background: var(--bg-input);
        border: 1px solid var(--border-subtle);
      }

      .seg-btn {
        padding: 6px 10px;
        border-radius: 7px;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .seg-btn.active {
        background: var(--accent);
        color: #fff;
      }

      /* Accordion Cards */
      .accordion-card {
        border: 1px solid var(--border-card);
        background: var(--bg-surface);
        border-radius: 16px;
        overflow: hidden;
      }

      .accordion-trigger {
        width: 100%;
        text-align: left;
        padding: 20px 24px;
        transition: background-color 0.15s ease;
      }

      .accordion-trigger:hover {
        background: rgba(21, 30, 59, 0.65);
      }

      .accordion-body {
        border-top: 1px solid #202948;
        background: #0d1326;
        padding: 20px 24px;
      }

      /* Charts */
      .bar-track {
        height: 10px;
        width: 100%;
        border-radius: 999px;
        background: var(--bg-input);
        border: 1px solid #1e2747;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: 999px;
        background: #8b5cf6;
      }

      .trend-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 10px;
        align-items: end;
        height: 160px;
        padding-top: 16px;
        border-top: 1px solid #202948;
      }

      .trend-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
        gap: 8px;
      }

      .trend-bar-wrap {
        width: 100%;
        max-width: 42px;
        flex: 1;
        display: flex;
        align-items: flex-end;
      }

      .trend-bar {
        width: 100%;
        border-radius: 6px 6px 0 0;
        background: #8b5cf6;
      }

      .trend-bar.empty {
        background: #1d2645;
      }

      /* Print Modal & A4 Sheet */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.78);
        padding: 16px;
      }

      .a4-sheet {
        max-width: 210mm;
        margin: 0 auto;
        background: #ffffff;
        color: #0f172a;
        border-radius: 12px;
        padding: 28px 34px;
      }

      .a4-sheet h2 {
        font-size: 0.95rem;
        font-weight: 700;
        color: #0f172a;
        border-bottom: 1px solid #cbd5e1;
        padding-bottom: 4px;
        margin-bottom: 8px;
      }

      .a4-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.75rem;
      }

      .a4-table th, .a4-table td {
        border: 1px solid #cbd5e1;
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }

      .a4-table thead th {
        background: #f1f5f9;
      }

      .print-only {
        display: none;
      }

      .site-footer {
        border-top: 1px solid #1d2542;
        background: #080c18;
        padding: 22px 0;
        font-size: 0.75rem;
        color: #7d89b0;
      }

      .footer-inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .pulse-icon {
        animation: pulseSoft 1.8s ease-in-out infinite;
      }

      @keyframes pulseSoft {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(0.96); }

        // =========================================================================
        // 3. Utility & Formatting Helpers
        // =========================================================================
        function escapeHtml(str) {
          return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function isSafeHttpUrl(url) {
          try {
            var parsed = new URL(url);
            return parsed.protocol === 'https:' || parsed.protocol === 'http:';
          } catch (e) {
            return false;
          }
        }

        function formatKoreanDate(isoDate) {
          try {
            var d = new Date(isoDate);
            return new Intl.DateTimeFormat('ko-KR', {
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            }).format(d);
          } catch (e) {
            return String(isoDate || '');
          }
        }

        function getStatusLabel(status) {
          if (status === 'verified') return '확인된 사실';
          if (status === 'refuted') return '반박된 주장';
          return '추가 검증 필요';
        }

        function getEvidenceLevelLabel(level) {
          if (level === 'sufficient') return '근거 충분';
          if (level === 'limited') return '근거 제한적';
          return '자료 부족';
        }

        function getEvidenceRelationLabel(relation) {
          if (relation === 'direct_support') return '직접 지지';
          if (relation === 'partial_support') return '부분적으로 지지';
          if (relation === 'refute') return '반박';
          if (relation === 'background_info') return '배경 정보';
          return '관련성 부족';
        }

        function getAlignmentLabel(alignment) {
          if (alignment === 'supports') return '주장과 일치·뒷받침';
          if (alignment === 'contradicts') return '주장과 불일치·반박';
          return '참고 맥락·추가 시각';
        }

        function updateDownloadButtonLabels() {
          var headerBtn = document.querySelector('.header-download');
          if (headerBtn) {

          }
        }

        function downloadStandaloneHtml() {
          var clone = document.documentElement.cloneNode(true);
          var appClone = clone.querySelector('#app');
          if (appClone) {
            appClone.innerHTML = '';
          }
          var htmlSource = '<!doctype html>\n' + clone.outerHTML;
          var blob = new Blob([htmlSource], { type: 'text/html;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = 'index.html';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1500);
          state.downloadedHtmlToast = true;
          updateDownloadButtonLabels();
          setTimeout(function () {
            state.downloadedHtmlToast = false;
            updateDownloadButtonLabels();
          }, 2200);
        }

        // =========================================================================
        // 5. LocalStorage Persistence & Image Compression
        // =========================================================================
        function loadHistory() {
          try {
            var raw = window.localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            var parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            return parsed
              .filter(function (item) {
                return item && typeof item.id === 'string' && item.result && item.createdAt;
              })
              .sort(function (a, b) {
                return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
              });
          } catch (e) {
            return [];
          }
        }

        function saveHistoryList(items) {
          var sorted = items
            .slice()
            .sort(function (a, b) {
              return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
            })
            .slice(0, MAX_HISTORY_ITEMS);

          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(sorted));
            return sorted;
          } catch (e) {
            var compact = sorted.map(function (item, idx) {
              if (idx === 0) return item;
              var copy = Object.assign({}, item);
              delete copy.imageThumbnailDataUrl;
              return copy;
            });
            try {
              window.localStorage.setItem(STORAGE_KEY, JSON.stringify(compact));
              return compact;
            } catch (e2) {
              var textOnly = sorted.map(function (item) {
                var copy = Object.assign({}, item);
                delete copy.imageThumbnailDataUrl;
                return copy;
              });
              try {
                window.localStorage.setItem(STORAGE_KEY, JSON.stringify(textOnly));
              } catch (e3) {
                // ignore quota error
              }
              return textOnly;
            }
          }
        }

        function addHistoryItem(newItem) {
          var current = loadHistory();
          var duplicate = current.some(function (existing) {
            var diff = Math.abs(
              new Date(existing.createdAt).getTime() - new Date(newItem.createdAt).getTime()
            );
            return (
              existing.id === newItem.id ||
              (diff < 10000 &&
                existing.inputText === newItem.inputText &&
                existing.hasImage === newItem.hasImage &&
                existing.result.title === newItem.result.title)
            );
          });
          if (duplicate) return current;
          return saveHistoryList([newItem].concat(current));
        }

        function createResizedImageDataUrl(dataUrl, maxWidth, quality) {
          return new Promise(function (resolve) {
            var img = new Image();
            img.onload = function () {
              try {
                var scale = Math.min(1, maxWidth / img.width);
                var canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(img.width * scale));
                canvas.height = Math.max(1, Math.round(img.height * scale));
                var ctx = canvas.getContext('2d');
                if (!ctx) {
                  resolve(dataUrl);
                  return;
                }
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', quality || 0.78));
              } catch (e) {
                resolve(dataUrl);
              }
            };
            img.onerror = function () {
              resolve(dataUrl);
            };
            img.src = dataUrl;
          });
        }

        // =========================================================================
        // 6. Clipboard Export Formatter
        // =========================================================================
        function formatResultForClipboard(result) {
          var lines = [];
          lines.push('[FACT HUNTER 정보 검증 리포트]');
          lines.push('제목: ' + result.title);
          if (result.topicCategory) lines.push('주제 분류: ' + result.topicCategory);
          lines.push('분석 일시: ' + formatKoreanDate(result.analyzedAt));
          lines.push('출처 검색 상태: ' + (result.grounding ? result.grounding.message : ''));
          lines.push('');
          lines.push('1. 전체 요약');
          lines.push(result.summary || '');
          if (result.imageDescription) {
            lines.push('');
            lines.push('[첨부 이미지 분석 내용]');
            lines.push(result.imageDescription);
          }
          lines.push('');
          lines.push('2. 핵심 주장별 검증 결과 및 근거 수준');
          (result.claims || []).forEach(function (c, idx) {
            lines.push(
              '- 주장 ' +
                (idx + 1) +
                ' [' +
                getStatusLabel(c.status) +
                ' | ' +
                getEvidenceLevelLabel(c.evidenceLevel) +
                ']: ' +
                c.claim
            );
            lines.push('  · 판단 근거: ' + c.statusRationale);
            lines.push('  · AI 참고 소견(추정): ' + c.aiEstimationNote);
            lines.push('  · 필요한 검증 근거: ' + c.neededEvidence);
          });
          lines.push('');
          lines.push('3. 검색된 외부 출처 (' + (result.sources ? result.sources.length : 0) + '건)');
          if (!result.sources || result.sources.length === 0) {
            lines.push('- 확인된 외부 검색 출처가 없습니다.');
          } else {
            result.sources.forEach(function (s, idx) {
              lines.push(
                '- [' +
                  (idx + 1) +
                  '] ' +
                  s.title +
                  ' (' +
                  s.publisher +
                  (s.publishedDate ? ' · ' + s.publishedDate : '') +
                  ')'
              );
              lines.push('  · 링크: ' + s.url);
            });
          }
          lines.push('');
          lines.push('4. 종합 분석 의견');
          lines.push(result.overallAssessment || '');
          return lines.join('\n');
        }

        // =========================================================================
        // 7. Highlight Segment Builder (Exact Verbatim Matching)
        // =========================================================================
        var HIGHLIGHT_META = {
          claim: { label: '핵심 주장', cls: 'hl-claim', color: '#a78bfa' },
          needs_verification: { label: '추가 검증 필요', cls: 'hl-needs_verification', color: '#38bdf8' },
          exaggeration: { label: '과장 표현', cls: 'hl-exaggeration', color: '#fbbf24' },
          fallacy: { label: '논리적 오류 의심', cls: 'hl-fallacy', color: '#fb7185' }
        };

        function buildHighlightSegments(inputText, result) {
          if (!inputText) return { segments: [], nodes: [] };
          var candidates = [];

          (result.fallaciesAndExaggerations || []).forEach(function (f, idx) {
            var q =
              (f.exactQuoteInInput && f.exactQuoteInInput.trim()) ||
              (inputText.indexOf(f.expression) !== -1 ? f.expression : '');
            if (!q || q.length < 3) return;
            var start = inputText.indexOf(q);
            if (start === -1) return;
            var kind = f.isExaggeration ? 'exaggeration' : 'fallacy';
            candidates.push({
              id: 'hl-fallacy-' + idx,
              start: start,
              end: start + q.length,
              text: q,
              kind: kind,
              label: HIGHLIGHT_META[kind].label,
              title: f.type,
              reason: f.explanation,
              targetId: 'fallacy-card-' + idx
            });
          });

          (result.claims || []).forEach(function (c) {
            var q =
              (c.exactQuoteInInput && c.exactQuoteInInput.trim()) ||
              (inputText.indexOf(c.claim) !== -1 ? c.claim : '');
            if (!q || q.length < 4) return;
            var start = inputText.indexOf(q);
            if (start === -1) return;
            var kind = c.status === 'needs_verification' ? 'needs_verification' : 'claim';
            candidates.push({
              id: 'hl-' + c.id,
              start: start,
              end: start + q.length,
              text: q,
              kind: kind,
              label:
                c.status === 'needs_verification'
                  ? '핵심 주장 · ' + getStatusLabel(c.status)
                  : HIGHLIGHT_META[kind].label,
              title: c.claim,
              reason: c.statusRationale || c.aiAnalyzedSummary || c.neededEvidence,
              targetId: 'claim-card-' + c.id
            });
          });

          candidates.sort(function (a, b) {
            return a.start - b.start || a.end - b.end;
          });

          var segments = [];
          var cursor = 0;
          candidates.forEach(function (seg) {
            if (seg.start >= cursor) {
              segments.push(seg);
              cursor = seg.end;
            }
          });

          var nodes = [];
          var pos = 0;
          segments.forEach(function (seg) {
            if (seg.start > pos) {
              nodes.push({ type: 'text', text: inputText.slice(pos, seg.start) });
            }
            nodes.push({ type: 'mark', seg: seg });
            pos = seg.end;
          });
          if (pos < inputText.length) {
            nodes.push({ type: 'text', text: inputText.slice(pos) });
          }

          return { segments: segments, nodes: nodes };
        }

          history.forEach(function (item) {

            '<div style="display:flex;justify-content:space-between;"><span>● 반박된 주장</span><strong class="tabular">' + refutedCount + '개 (' + Math.round((refutedCount / denom) * 100) + '%)</strong></div>' +

            '</div></div></section>';

          // Topic Bar Chart
          html +=
            '<section class="card stack-md">' +

          html += '</div></section></div>';

              '<span class="text-xs dim tabular">' + b.label + '</span></div>';
          });
          html += '</div></section></div>';
          return html;
        }

        function render() {
          var appEl = document.getElementById('app');
          if (!appEl) return;

          var bodyHtml = '';
          if (state.isAnalyzing) {
            bodyHtml = renderLoadingView();
          } else if (state.view === 'result' && state.currentResult) {
            bodyHtml = renderResultView();
          } else if (state.view === 'history') {
            bodyHtml = renderHistoryView();
          } else if (state.view === 'dashboard') {
            bodyHtml = renderDashboardView();
          } else if (state.view === 'guide') {

            renderHeader() +
            '<main>' +
            bodyHtml +
            '</main>' +
            renderFooter();

          bindFormListeners();

        function bindFormListeners() {
          var form = document.getElementById('analyze-form');
          if (form) {
            form.addEventListener('submit', function (e) {
              e.preventDefault();
              runAnalysis(state.textInput, state.image, state.enableSearch);
            });
            form.addEventListener('dragover', function (e) {
              e.preventDefault();
              form.classList.add('form-dragging');
            });
            form.addEventListener('dragleave', function () {
              form.classList.remove('form-dragging');
            });
            form.addEventListener('drop', function (e) {
              e.preventDefault();
              form.classList.remove('form-dragging');
              var file = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
              handleImageFile(file);
            });
          }

          var textarea = document.getElementById('fact-input');
          if (textarea) {
            textarea.addEventListener('input', function (e) {
              state.textInput = e.target.value;
              var cntEl = document.getElementById('char-count');
              if (cntEl) {
                cntEl.textContent =
                  state.textInput.length.toLocaleString() +
                  ' / ' +
                  MAX_TEXT_LENGTH.toLocaleString() +
                  '자';
              }
            });
          }

          var fileInput = document.getElementById('image-upload-input');
          if (fileInput) {
            fileInput.addEventListener('change', function (e) {
              var file = e.target.files ? e.target.files[0] : null;
              handleImageFile(file);
              e.target.value = '';
            });
          }

          var searchToggle = document.getElementById('search-toggle');
          if (searchToggle) {
            searchToggle.addEventListener('change', function (e) {
              state.enableSearch = Boolean(e.target.checked);
            });
          }

          var historySearch = document.getElementById('history-search');
          if (historySearch) {
            historySearch.addEventListener('input', function (e) {
              var cursor = e.target.selectionStart;
              state.historySearch = e.target.value;
              render();
              var nextInput = document.getElementById('history-search');
              if (nextInput) {
                nextInput.focus();
                if (typeof cursor === 'number') {
                  nextInput.setSelectionRange(cursor, cursor);
                }
              }
            });
          }
        }

        function handleImageFile(file) {
          if (!file) return;
          state.errorMessage = null;
          state.isOfflineBlocked = false;

          if (ALLOWED_IMAGE_TYPES.indexOf(file.type) === -1) {
            state.errorMessage =
              '지원하지 않는 파일 형식(' +
              (file.type || '알 수 없음') +
              ')입니다. JPG, PNG, WEBP 이미지만 업로드할 수 있습니다.';
            render();
            return;
          }

          if (file.size > 10 * 1024 * 1024) {
            state.errorMessage =
              '이미지 파일이 너무 큽니다. 10MB 이하의 이미지를 선택해 주세요.';
            render();
            return;
          }

          var reader = new FileReader();
          reader.onload = async function () {
            var rawDataUrl = typeof reader.result === 'string' ? reader.result : '';
            if (!rawDataUrl) {
              state.errorMessage = '이미지를 읽는 중 오류가 발생했습니다.';
              render();
              return;
            }

            var finalDataUrl = rawDataUrl;
            var finalMime = file.type;
            if (file.size > 2.5 * 1024 * 1024) {
              finalDataUrl = await createResizedImageDataUrl(rawDataUrl, 1600, 0.82);
              finalMime = 'image/jpeg';
            }

            var base64Data = finalDataUrl.replace(/^data:[^;]+;base64,/, '');
            state.image = {
              name: file.name,
              size: file.size,
              mimeType: finalMime,
              dataUrl: finalDataUrl,
              base64Data: base64Data
            };
            render();
          };
          reader.onerror = function () {
            state.errorMessage = '이미지 파일을 불러오지 못했습니다.';
            render();
          };
          reader.readAsDataURL(file);
        }

        async function runAnalysis(targetText, targetImage, useSearch) {
          if (state.isAnalyzing) return;
          var trimmed = String(targetText || '').trim();
          if (!trimmed && !targetImage) {
            state.errorMessage = '검증할 뉴스·SNS 문장을 입력하거나 이미지를 업로드해 주세요.';
            state.isOfflineBlocked = false;
            render();
            return;
          }

          if (window.location.protocol === 'file:') {
            state.errorMessage =
              '현재 브라우저에서 index.html 파일을 직접 열어(file://) 실행 중이므로 백엔드 API(/api/analyze)에 연결할 수 없습니다. GitHub에 업로드 후 Vercel에 배포(GEMINI_API_KEY 설정)하면 실제 Gemini AI 분석과 Google Search 출처 검증이 작동합니다.';
            state.isOfflineBlocked = true;
            render();
            return;
          }

          state.errorMessage = null;
          state.isOfflineBlocked = false;
          state.isAnalyzing = true;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });

          try {
            var response = await fetch('/api/analyze', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                text: trimmed,
                enableSearch: useSearch,
                image: targetImage
                  ? { mimeType: targetImage.mimeType, data: targetImage.base64Data }
                  : null
              })
            });

            var payload = await response.json().catch(function () { return null; });
            if (!response.ok) {
              var msg =
                payload && typeof payload.error === 'string'
                  ? payload.error
                  : '분석 요청에 실패했습니다 (오류 코드 ' + response.status + ').';
              throw new Error(msg);
            }

            var newId = 'fh-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
            state.currentHistoryId = newId;
            state.currentResult = payload;
            state.analyzedText = trimmed;
            state.analyzedImageUrl = targetImage ? targetImage.dataUrl : null;
            state.expandedClaims = {};
            if (payload.claims && payload.claims[0]) {
              state.expandedClaims[payload.claims[0].id] = true;
            }
            state.expandedSources = {};
            state.expandedFallacies = {};
            state.activeHighlight = null;
            state.view = 'result';

            var thumbUrl = targetImage
              ? await createResizedImageDataUrl(targetImage.dataUrl, 320, 0.7)
              : undefined;

            state.history = addHistoryItem({
              id: newId,
              createdAt: payload.analyzedAt || new Date().toISOString(),
              inputText: trimmed,
              hasImage: Boolean(targetImage),
              imageName: targetImage ? targetImage.name : undefined,
              imageThumbnailDataUrl: thumbUrl,
              result: payload
            });
          } catch (err) {
            var message =
              err instanceof Error
                ? err.message
                : '서버와의 통신 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.';
            if (
              message.indexOf('Failed to fetch') !== -1 ||
              message.indexOf('NetworkError') !== -1
            ) {
              message =
                '분석 API(/api/analyze) 서버에 연결할 수 없습니다. Vercel 배포 환경에서 GEMINI_API_KEY가 설정되어 있는지 확인해 주세요.';
              state.isOfflineBlocked = true;
            }
            state.errorMessage = message;
            state.view = 'home';
          } finally {
            state.isAnalyzing = false;
            render();
          }
        }

        // Global Click Delegation
        document.addEventListener('click', function (e) {
          var target = e.target.closest('[data-action]');
          if (!target) return;

          var action = target.getAttribute('data-action');

          if (action === 'nav') {
            var nextView = target.getAttribute('data-view');
            state.errorMessage = null;
            state.isOfflineBlocked = false;
            if (nextView !== 'history') {
              state.historyTopicFilter = null;
            }
            state.view = nextView;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          if (action === 'clear-text') {
            state.textInput = '';
            state.errorMessage = null;
            render();
            return;
          }

          if (action === 'clear-error') {
            state.errorMessage = null;
            state.isOfflineBlocked = false;
            render();
            return;
          }

          if (action === 'pick-image') {
            var inp = document.getElementById('image-upload-input');
            if (inp) inp.click();
            return;
          }

          if (action === 'remove-image') {
            state.image = null;
            render();
            return;
          }

          if (action === 'fill-example') {
            var exId = target.getAttribute('data-id');
            var ex = EXAMPLE_CASES.find(function (x) { return x.id === exId; });
            if (ex) {
              state.textInput = ex.text;
              state.errorMessage = null;
              state.isOfflineBlocked = false;
              render();
            }
            return;
          }

          if (action === 'run-example') {
            var exRunId = target.getAttribute('data-id');
            var exRun = EXAMPLE_CASES.find(function (x) { return x.id === exRunId; });
            if (exRun) {
              state.textInput = exRun.text;
              state.image = null;
              runAnalysis(exRun.text, null, state.enableSearch);
            }
            return;
          }

          if (action === 'download-html') {
            downloadStandaloneHtml();
            return;
          }

          if (action === 'quick-example') {
            state.view = 'home';
            state.textInput = EXAMPLE_CASES[0].text;
            state.image = null;
            runAnalysis(EXAMPLE_CASES[0].text, null, state.enableSearch);
            return;
          }

          if (action === 'open-offline-demo') {
            state.currentHistoryId = null;
            state.currentResult = OFFLINE_DEMO_RESULT;
            state.analyzedText = OFFLINE_DEMO_INPUT;
            state.analyzedImageUrl = null;
            state.expandedClaims = { 'claim-1': true };
            state.expandedSources = {};
            state.expandedFallacies = {};
            state.activeHighlight = null;
            state.errorMessage = null;
            state.isOfflineBlocked = false;
            state.view = 'result';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          if (action === 'open-history') {
            var hId = target.getAttribute('data-id');
            var found = state.history.find(function (h) { return h.id === hId; });
            if (found) {
              state.currentHistoryId = found.id;
              state.currentResult = found.result;
              state.analyzedText = found.inputText;
              state.analyzedImageUrl = found.imageThumbnailDataUrl || null;
              state.expandedClaims = {};
              if (found.result.claims && found.result.claims[0]) {
                state.expandedClaims[found.result.claims[0].id] = true;
              }
              state.expandedSources = {};
              state.expandedFallacies = {};
              state.activeHighlight = null;
              state.view = 'result';
              render();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            return;
          }

          if (action === 'delete-history') {
            var delId = target.getAttribute('data-id');
            state.history = saveHistoryList(
              loadHistory().filter(function (h) { return h.id !== delId; })
            );
            render();
            return;
          }

          if (action === 'ask-clear-all') {
            state.confirmClearAll = true;
            render();
            return;
          }

          if (action === 'cancel-clear-all') {
            state.confirmClearAll = false;
            render();
            return;
          }

          if (action === 'confirm-clear-all') {
            try { window.localStorage.removeItem(STORAGE_KEY); } catch (err) {}
            state.history = [];
            state.confirmClearAll = false;
            render();
            return;
          }

          if (action === 'set-history-filter') {
            state.historyStatusFilter = target.getAttribute('data-filter') || 'all';
            render();
            return;
          }

          if (action === 'clear-topic-filter') {
            state.historyTopicFilter = null;
            render();
            return;
          }

          if (action === 'select-topic') {
            state.historyTopicFilter = target.getAttribute('data-topic');
            state.view = 'history';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          if (action === 'toggle-claim') {
            var cid = target.getAttribute('data-id');
            state.expandedClaims[cid] = !state.expandedClaims[cid];
            render();
            return;
          }

          if (action === 'toggle-source') {
            var sid = target.getAttribute('data-id');
            state.expandedSources[sid] = !state.expandedSources[sid];
            render();
            return;
          }

          if (action === 'toggle-fallacy') {
            var fidx = Number(target.getAttribute('data-idx'));
            state.expandedFallacies[fidx] = !state.expandedFallacies[fidx];
            render();
            return;
          }

          if (action === 'select-highlight') {
            var hlId = target.getAttribute('data-hl-id');
            var hl = buildHighlightSegments(state.analyzedText, state.currentResult);
            var seg = hl.segments.find(function (s) { return s.id === hlId; });
            if (seg) {
              state.activeHighlight = {
                kind: seg.kind,
                targetId: seg.targetId,
                quote: seg.text
              };
              render();
            }
            return;
          }

          if (action === 'close-highlight') {
            state.activeHighlight = null;
            render();
            return;
          }

          if (action === 'jump-card') {
            var targetId = target.getAttribute('data-target') || '';
            if (targetId.indexOf('claim-card-') === 0) {
              state.expandedClaims[targetId.replace('claim-card-', '')] = true;
            } else if (targetId.indexOf('fallacy-card-') === 0) {
              state.expandedFallacies[Number(targetId.replace('fallacy-card-', ''))] = true;
            }
            render();
            setTimeout(function () {
              var el = document.getElementById(targetId);
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 40);
            return;
          }

          if (action === 'jump-quote') {
            state.activeHighlight = {
              kind: target.getAttribute('data-kind'),
              targetId: target.getAttribute('data-target'),
              quote: target.getAttribute('data-quote')
            };
            render();
            setTimeout(function () {
              var el = document.getElementById('original-text-viewer');
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 40);
            return;
          }

          if (action === 'copy-report') {
            if (!state.currentResult) return;
            var txt = formatResultForClipboard(state.currentResult);
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(txt).catch(function () {});
            } else {
              var ta = document.createElement('textarea');
              ta.value = txt;
              ta.style.position = 'fixed';
              ta.style.opacity = '0';
              document.body.appendChild(ta);
              ta.select();
              try { document.execCommand('copy'); } catch (err) {}
              document.body.removeChild(ta);
            }
            state.copied = true;
            render();
            setTimeout(function () {
              state.copied = false;
              if (state.view === 'result') render();
            }, 2200);
            return;
          }

          if (action === 'open-print') {
            state.isPrintPreviewOpen = true;
            render();
            return;
          }

          if (action === 'close-print') {
            state.isPrintPreviewOpen = false;
            render();
            return;
          }

          if (action === 'do-print') {
            window.print();
            return;
          }

          if (action === 'save-feedback' || action === 'save-feedback-comment') {
            if (!state.currentHistoryId) return;
            var existing = state.history.find(function (h) { return h.id === state.currentHistoryId; });
            var ratingAttr = target.getAttribute('data-rating');
            var ratingVal = ratingAttr || (existing && existing.feedback ? existing.feedback.rating : 'helpful');
            var commentEl = document.getElementById('feedback-comment');
            var commentVal = commentEl ? commentEl.value.trim() : '';

            state.history = saveHistoryList(
              loadHistory().map(function (h) {
                if (h.id !== state.currentHistoryId) return h;
                return Object.assign({}, h, {
                  feedback: {
                    rating: ratingVal,
                    comment: commentVal || undefined,
                    submittedAt: new Date().toISOString()
                  }
                });
              })
            );
            state.feedbackSavedToast = true;
            render();
            setTimeout(function () {
              state.feedbackSavedToast = false;
              if (state.view === 'result') render();
            }, 2200);
          }
        });

        // Initial boot
        state.history = loadHistory();
        render();
      })();
    </script>
